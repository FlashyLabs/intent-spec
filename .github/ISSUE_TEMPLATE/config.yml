    url: https://github.com/FlashyLabs/intent-spec/blob/main/SECURITY.md
    about: A document the checker wrongly accepts or refuses, or anything in `verify` that follows a redirect it should not. Read SECURITY.md for the private channel; do not file the finding as a public issue.
